# Tests only: on top of nebula.conf, folders the way many
# old servers keep them, under `INBOX.` with `.` between levels.
namespace inbox {
  prefix = INBOX.
  separator = .
}

# Its own Postfix (docker/compose.yaml).
submission_host = postfix-prefix:10025
