# Development only: Dovecot as a plain IMAP server for the
# bridge tests. Its submission service relays to Stalwart's authenticated
# submission port as alice, so only alice can send through it. (Stalwart's
# port 25 runs the inbound checks, which here take minutes on DNS.)
submission_relay_host = stalwart
submission_relay_port = 465
submission_relay_ssl = smtps
# Stalwart's dev certificate is self-signed.
submission_relay_ssl_verify = no
submission_relay_user = alice
submission_relay_password = %{env:RELAY_PASSWORD}
import_environment {
  RELAY_PASSWORD = %{env:RELAY_PASSWORD}
}

# Name for EHLO: Stalwart refuses the container id, which is no domain.
hostname = dovecot.nebulamail.test

# Mail Sieve sends (vacation responses, redirects): to Postfix's port for
# Dovecot (docker/postfix), which delivers to @nebulamail.test itself. Nothing
# reaches Stalwart.
submission_host = postfix:10025
# Postfix delivers to the bare user (`alice`), which isn't what mail says in
# To: (`alice@nebulamail.test`).
sieve_vacation_check_recipient = no
