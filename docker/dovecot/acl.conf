# Tests only, on the `dovecot` service: folders named
# `nebula-mail-test-*-noflags` lose the `w` right (flags other than \Seen
# and \Deleted, and keywords), so their PERMANENTFLAGS have no `\*` nor
# `\Flagged`. That is how mail/tests/server.rs tests a keyword change on
# copies that can't all keep it. Every other folder keeps all rights.
# Dovecot 2.4 has no global ACL files: the ACL lives here. IMAP's ACL
# extension (`imap_acl`) is not needed for PERMANENTFLAGS and stays off.
mail_plugins {
  acl = yes
}
acl_driver = vfile
namespace inbox {
  mailbox nebula-mail-test-*-noflags {
    acl owner {
      rights = lrsitekx
    }
  }
}
