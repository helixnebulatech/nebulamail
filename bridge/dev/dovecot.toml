# DEVELOPMENT ONLY: the bridge against the local Dovecot in Docker
# (docker/compose.yaml, profile "bridge"), over IMAP and SMTP, with
# calendars and contacts from Radicale (same users and password). Same as
# dev.toml, on other ports, so both can run at once.
#
#   docker compose -f docker/compose.yaml --profile bridge up -d stalwart dovecot radicale
#   cd bridge
#   cargo run -p nebula-bridge -- gen-master-key > dev/master.key
#   cargo run -p nebula-bridge -- serve --config dev/dovecot.toml
#
# Then point the web app (on port 3012) at it: JMAP_SERVER=http://localhost:8091,
# OAUTH_CLIENT_ID=nebula-dev, OAUTH_CLIENT_SECRET=nebula-dev-bridge-secret.
# That secret is public (it is in this file): never use it anywhere else.

[server]
listen = "127.0.0.1:8091"
public_url = "http://localhost:8091"
app_origins = ["http://localhost:3012"]

[store]
path = "dovecot.db"

[secrets]
master_key_file = "master.key"

[[oauth.clients]]
id = "nebula-dev"
# argon2id of "nebula-dev-bridge-secret" (development only).
secret_hash = "$argon2id$v=19$m=19456,t=2,p=1$kiNCtYzYa8B0ksXw383Jzg$/3RUeVgqm5mXuEuRcVRlOMxNERXy6XYOwpKv6jC+Ur0"
redirect_uris = ["http://localhost:3012/auth/callback"]

[upstream]
# Dovecot runs on this machine.
private_network = true
# Dovecot's submission does not save a copy in Sent.
sent_copy = "append"
# Dovecot takes any user name ("alice", "bob") with one password
# (TEST_DOVECOT_PASSWORD, by default "password"); its submission relays
# to Stalwart as alice.
email_domain = "nebulamail.test"

[upstream.imap]
host = "127.0.0.1"
port = 2993
tls = "implicit"
# Dovecot's self-signed certificate; only allowed for loopback.
tls_verify = false

[upstream.smtp]
host = "127.0.0.1"
port = 2465
tls = "implicit"
tls_verify = false

# Radicale: CalDAV/CardDAV over plain HTTP on loopback, no scheduling (the
# bridge will send invitations itself).
[upstream.dav]
url = "http://127.0.0.1:5232/"

# Pigeonhole's ManageSieve (filters and vacation response), published on
# 24190; the IMAP host and its tls_verify by default.
[upstream.sieve]
port = 24190

# Web Push to the browsers' real push services (bridge.example.toml).
[push]
contact = "mailto:admin@nebulamail.test"
