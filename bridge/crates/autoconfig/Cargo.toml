[package]
name = "nebula-autoconfig"
description = "Finds a domain's mail servers (DNS SRV, Thunderbird autoconfig, Autodiscover) through net-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
net-guard.workspace = true
nebula-managesieve.workspace = true
nebula-tls.workspace = true
bytes.workspace = true
hickory-resolver.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
roxmltree.workspace = true
rustls-pki-types.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time", "rt"] }
tracing.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
