[package]
name = "nebula-dav"
description = "CalDAV/CardDAV client: pinned connections, manual redirects, limits, discovery and sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Fake iCloud-style account hosts on loopback, for the fake-server tests of
# other crates (`groupware`). Only dev-dependencies enable it; a release
# build with it does not compile (`lib.rs`).
test-account-hosts = []

[dependencies]
nebula-dav-proto.workspace = true
nebula-tls.workspace = true
net-guard.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
url.workspace = true
rustls-pki-types.workspace = true
flate2.workspace = true
base64.workspace = true
secrecy.workspace = true
subtle.workspace = true
zeroize.workspace = true
tracing.workspace = true

[dev-dependencies]
nebula-tests.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "service"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
proptest.workspace = true

[lints]
workspace = true
