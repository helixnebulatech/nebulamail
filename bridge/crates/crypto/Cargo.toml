[package]
name = "nebula-crypto"
description = "Credential encryption (XChaCha20-Poly1305 with KEK/DEK) and token hashing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
# Wipe the expanded cipher key and argon2 blocks from memory after use.
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
argon2 = { workspace = true, features = ["zeroize"] }
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
secrecy.workspace = true
zeroize.workspace = true
data-encoding.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
