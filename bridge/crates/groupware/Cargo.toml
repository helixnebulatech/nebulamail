[package]
name = "nebula-groupware"
description = "Calendars and contacts over CalDAV/CardDAV: sync and iCalendar/vCard <-> JSCalendar/JSContact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nebula-store.workspace = true
nebula-dav.workspace = true
nebula-crypto.workspace = true
net-guard.workspace = true
calcard.workspace = true
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Fake iCloud account hosts for `tests/icloud.rs` (never in a release build).
nebula-dav = { workspace = true, features = ["test-account-hosts"] }
nebula-tests.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true

[lints]
workspace = true
