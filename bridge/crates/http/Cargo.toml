[package]
name = "nebula-http"
description = "HTTP server: OAuth, JMAP session and API, blobs, EventSource"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No dependency on `nebula-mail` or `nebula-jmap`: they plug in through the
# `Backend` trait, so this crate can be built and tested on its own.
[dependencies]
nebula-crypto.workspace = true
nebula-store.workspace = true
nebula-jmap-proto.workspace = true
axum = { workspace = true, features = ["matched-path"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "catch-panic"] }
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
futures.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
maud.workspace = true
secrecy.workspace = true
sha2.workspace = true
subtle.workspace = true
data-encoding.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile.workspace = true

[features]
# Exposes the parsers of untrusted input to the fuzz targets (`fuzz/`).
fuzzing = []

[lints]
workspace = true
