# Fuzz targets for `cargo fuzz` (nightly, CI only).
# Run from this directory: `cargo +nightly fuzz run response`.

[package]
name = "nebula-managesieve-proto-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
nebula-managesieve-proto = { path = ".." }

# Standalone: not a member of the bridge workspace (needs nightly).
[workspace]
members = ["."]

[[bin]]
name = "response"
path = "fuzz_targets/response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command"
path = "fuzz_targets/command.rs"
test = false
doc = false
bench = false
